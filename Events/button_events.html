<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event_Handeling</title>
  </head>
  <body>
    <button
      onclick="
        console.log('Button was Clicked!');
        alert('Hello!');
      "
    >
      Click me!
    </button>
    <button
      ondblclick="
        console.log('Button was clicked 2 times');
        alert('Hello Again!');
      "
    >
      Click me 2 times
    </button>
    <script></script>
  </body>
</html>
