<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse_Event</title>
    <style>
      div {
        height: 100px;
        width: 100px;
        background-color: yellow;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div
      onmouseover="
        console.log('You Hovered over div');
        alert('do not touch div');
      "
    >
      This is a div
    </div>
    </body>
  </body>
</html>
